<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <!-- Ícono de la pestaña del navegador: logo de la UCEN (public/favicon.png).
       apple-touch-icon es el ícono que usa el celular si se agrega la app
       a la pantalla de inicio (RNF-01). -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UCEN - Inventario Ciencias Básicas</title>

  <!-- M16: Fuente Inter desde Google Fonts (RNF-01).
       No es un paquete npm; se carga con un <link> como en el mockup.
       preconnect acelera la conexión con Google Fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
</head>

<body>
  <!-- React "dibuja" toda la aplicación dentro de este div -->
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
